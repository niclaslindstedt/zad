[package]
name = "zad-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Command-line interface for zad — connects AI agents to external services (Discord, Slack, Google Calendar, Spotify, Telegram, YouTube Music, 1Password) via scoped service configurations."

[[bin]]
name = "zad"
path = "src/main.rs"

[lib]
name = "zad_cli"
path = "src/lib.rs"

[dependencies]
zad = { path = "../zad", version = "0.7.3" }

async-trait = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
open = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
base64 = { workspace = true }
predicates = { workspace = true }
serial_test = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
