# Example YouTube Music permissions policy.
#
# Drop this at one of:
#   ~/.zad/services/ymusic/permissions.toml                       (global)
#   ~/.zad/projects/<slug>/services/ymusic/permissions.toml       (local, per project)
#
# When both files exist they INTERSECT: a call must pass every file
# that is present. Missing files contribute no restrictions, so scope
# is the only gate when neither file exists.

# Pattern grammar (used anywhere an allow/deny list appears):
#   "zad-test"                  exact name match
#   "zad-*"                     glob (`*` and `?` wildcards)
#   "re:^[A-Za-z0-9_-]{11}$"    full Rust regex (anchor it yourself)
#   "dQw4w9WgXcQ"               matches the resolved video / playlist ID

# Evaluation order:
#   1. Any deny match -> denied (deny always wins).
#   2. Empty allow list -> no positive constraint on this front.
#   3. Otherwise the call must match at least one allow pattern.

# The `targets` patterns are evaluated against:
#   - search          : the raw query string
#   - playlists_*     : playlist title (when known) and the bare
#                       playlist ID (PL...)
#   - library_read    : the bare video ID
#   - library_write   : the raw input the operator passed (URL or ID)

# -----------------------------------------------------------------
# Shared defaults. Each per-function block inherits these and can
# narrow them further (never loosen).
# -----------------------------------------------------------------

[content]
# Applies to playlist titles, descriptions, and search queries.
deny_words = ["password", "api_key", "secret"]
deny_patterns = [
    "(?i)bearer\\s+[a-z0-9._-]+",
]
max_length = 256

[time]
# Lock runtime to UTC business hours. `windows` is in UTC.
days = ["mon", "tue", "wed", "thu", "fri"]
windows = ["09:00-22:00"]

# -----------------------------------------------------------------
# Per-function overrides.
# -----------------------------------------------------------------

# Search is read-only and harmless. We don't restrict targets, but
# inherit the global content rules so the agent can't search for
# `password` etc.
[search]

# Read-only access to all of the user's playlists is fine.
[playlists_read]

# Write access to playlists is restricted to a couple of safe
# prefixes. The agent cannot rename/delete/mutate any playlist
# whose title contains "release" or "official".
[playlists_write]
targets.allow = ["zad-*", "scratch-*"]
targets.deny = ["*release*", "*official*"]
# Tighten the time window further for write operations.
time.windows = ["10:00-18:00"]

# Reading the liked-videos library: no restrictions.
[library_read]

# Writing the library is allowed, but blocks a hard-coded "do not
# touch" set. Replace these with whatever video IDs the operator
# wants protected.
[library_write]
targets.deny = [
    "dQw4w9WgXcQ",
]
